    <h1>Rules for naming JS Variables</h1><br>
    <p>Variable names can only contain <b>letters</b>, <b>numbers</b>, <b>$</b> and <b>_</b>. For example: <i>$my_1stVariable</i></p>
    <p>Variables must begin with a <b>letter</b>, <b>$</b> or <b>_</b>. For example: <i>$name</i>, <i>_name</i> or <i>name</i></p>
    <p>Variable names are case <b>sensitive</b>.</p>
    <p>Variable names should not be JS <b>keywords</b>.</p>
