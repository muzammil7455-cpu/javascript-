<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOP WATCH</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="stopwatch">
    <h1 id="displayTime">00:00:00</h1>
    <div class="buttons">
        <img src="/images/stop.png" onclick="watchStop()" alt="STOP">
        <img src="/images/start.png" onclick="watchStart()" alt="START">
        <img src="/images/reset.png" onclick="watchReset()" alt="RESET">


    </div>
</div>
    <script src="/script.js"></script>
</body>
</html>
